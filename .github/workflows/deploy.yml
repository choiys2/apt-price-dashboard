name: 아파트 실거래가 대시보드 자동 갱신·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00 전날)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write     # 원본 캐시(data/raw) 누적 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      healthy: ${{ steps.pipeline.outputs.healthy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 pip 설치가 없다.
      - name: 단위 테스트
        run: |
          python test_parse.py
          python test_analytics.py

      # 수집량이 임계치 미만이면 run_apt_pipeline.py 가 exit 2 로 끝난다.
      # 그 경우 healthy=false 로 두고 배포 잡을 통째로 건너뛴다. live/ 는 gitignore라
      # "어제 버전으로 롤백"할 파일이 없으므로, 배포를 안 하는 것 자체가 롤백이 된다.
      - name: 수집 + 집계 + 대시보드 생성
        id: pipeline
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          if python run_apt_pipeline.py --months 15; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::수집량이 임계치 미만이라 이번 배포를 건너뛴다."
          fi

      # 과거 월의 원본은 확정값이라 한 번 받아두면 다시 안 받는다. 캐시를 저장소에
      # 누적해두면 매일 도는 건 최근 3개월분(약 230회 호출)뿐이다.
      - name: 원본 캐시 커밋 (data/raw)
        if: steps.pipeline.outputs.healthy == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "chore: 실거래 원본 캐시 갱신 $(date -u +%F)"
          git push || true

      - name: Pages 아티팩트 준비
        if: steps.pipeline.outputs.healthy == 'true'
        run: |
          mkdir -p _site
          cp live/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.pipeline.outputs.healthy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.healthy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
