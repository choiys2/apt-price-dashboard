name: 아파트 실거래가 대시보드 자동 갱신·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00 전날)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write     # 원본 캐시(data/) 누적 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# data.go.kr 이 러너에 따라 간헐적으로 연결을 끊는다(하루에 여섯 번 관측). 한 번 막히면
# 그날 갱신이 통째로 날아가므로, 실패하면 새 러너로 최대 3번까지 다시 시도한다.
# 앞 시도가 성공하면 뒤 시도는 실행되지 않아 API 호출 낭비가 없다.
jobs:
  try1:
    uses: ./.github/workflows/collect.yml
    secrets: inherit

  try2:
    needs: try1
    if: always() && needs.try1.outputs.healthy != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit

  try3:
    needs: [try1, try2]
    if: always() && needs.try1.outputs.healthy != 'true' && needs.try2.outputs.healthy != 'true'
    uses: ./.github/workflows/collect.yml
    secrets: inherit

  deploy:
    needs: [try1, try2, try3]
    # 셋 중 하나라도 성공했으면 그 시도가 올려둔 아티팩트로 배포한다.
    # 전부 실패하면 배포를 건너뛰어 이미 떠 있는 어제 버전을 그대로 둔다
    # (live/ 는 gitignore 라 롤백할 파일이 없다. 배포를 안 하는 것이 곧 롤백이다).
    if: >-
      always() && (needs.try1.outputs.healthy == 'true'
      || needs.try2.outputs.healthy == 'true'
      || needs.try3.outputs.healthy == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 성공한 시도의 대시보드 내려받기
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: 내용 확인
        run: |
          test -s _site/index.html
          echo "대시보드 $(stat -c%s _site/index.html) 바이트"
          # 궤적 조각이 빠져도 관심단지 목록은 돌아가고 그래프만 슬로프로 떨어진다.
          # 배포를 막을 일은 아니지만 조용히 넘어가지는 않게 로그에 남긴다.
          n=$(find _site/history -name '*.json' 2>/dev/null | wc -l)
          echo "관심단지 궤적 조각 ${n}개"
          [ "$n" -gt 0 ] || echo "::warning::history 조각이 없다. 궤적이 슬로프로 대체된다."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
