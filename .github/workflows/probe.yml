name: API 실측 확인 (probe)

# 로컬/에이전트 환경에서는 apis.data.go.kr 아웃바운드가 막혀 있어 실제 응답을 볼 수 없다.
# 이 워크플로를 수동 실행해 인증키가 살아 있는지, 응답 필드명이 코드의 가정과 맞는지 확인한다.
on:
  workflow_dispatch:
    inputs:
      lawd:
        description: "시군구 법정동코드 5자리 (예: 11680 강남구, 41135 성남시 분당구)"
        required: true
        default: "11680"
      ymd:
        description: "계약연월 YYYYMM (예: 202606)"
        required: true
        default: "202606"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파서 단위 테스트 (네트워크 불필요)
        run: python test_parse.py

      - name: 시군구 코드 테이블 확인
        run: python lawd_codes.py

      # 호스트에 닿기는 하는지부터 본다. 여기서 막히면 애플리케이션 레벨 문제가 아니라
      # 러너에서 data.go.kr 로 나가는 경로 자체가 안 되는 것이다.
      - name: 네트워크 도달 확인 (DNS / TCP / TLS)
        continue-on-error: true
        run: |
          echo "--- 러너 공인 IP (data.go.kr 이 보는 출발지) ---"
          curl -sS --max-time 10 https://api.ipify.org || echo "(확인 실패)"; echo
          echo "--- 대조군: 국내 호스트(www.data.go.kr) 도달 여부 ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}, 접속 %{time_connect}s\n" \
            --max-time 10 "https://www.data.go.kr" || echo "포털 본체도 실패"
          echo "--- DNS ---"; getent hosts apis.data.go.kr || echo "DNS 실패"
          echo "--- HTTPS (10초) ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}, 접속 %{time_connect}s, 전체 %{time_total}s\n" \
            --max-time 10 "https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade" || echo "HTTPS 실패"
          echo "--- HTTP 평문 (10초) ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}, 접속 %{time_connect}s, 전체 %{time_total}s\n" \
            --max-time 10 "http://apis.data.go.kr/1613000/RTMSDataSvcAptTrade" || echo "HTTP 실패"

      # 전월세는 매매와 별개의 서비스(RTMSDataSvcAptRent)라 활용신청도 따로다.
      # 미승인이면 게이트웨이가 SERVICE_ACCESS_DENIED 를 돌려주는데, 수집기는 이를
      # 일반 실패로 처리해 조용히 0건이 된다. 여기서 응답을 직접 확인한다.
      - name: 전월세 API 실측
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          python fetch_apt_rents.py probe \
            --lawd "${{ inputs.lawd }}" \
            --ymd "${{ inputs.ymd }}"

      - name: 실거래가 API 실측 (HTTPS/HTTP·페이지크기 변형)
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          python fetch_apt_trades.py probe \
            --lawd "${{ inputs.lawd }}" \
            --ymd "${{ inputs.ymd }}" \
            --timeout 60
